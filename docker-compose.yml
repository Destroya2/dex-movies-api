# Pile de développement local, au plus proche de la production.
#
# Le cache L2 de production est Upstash, accessible en REST. Un conteneur Redis
# nu ne suffirait donc pas : `serverless-redis-http` expose un Redis classique
# via la MÊME API REST qu'Upstash, ce qui permet de tester localement le vrai
# chemin de code (et pas une branche « pas de Redis » qui n'existe qu'en dev).

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Cache L2 : mêmes noms de variables que ceux provisionnés par Vercel.
      KV_REST_API_URL: http://redis-http:80
      KV_REST_API_TOKEN: jeton-local
      # Sans clé TMDB, le catalogue et le pont TMDB→MovieBox sont inactifs.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # Relais résidentiel (catalogue VF + repli vidéo) — optionnel en local.
      FALLBACK_RESOLVER_URL: ${FALLBACK_RESOLVER_URL:-}
      RESOLVER_TOKEN: ${RESOLVER_TOKEN:-}
    depends_on:
      redis-http:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: jeton-local
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
